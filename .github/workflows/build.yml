name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o StgNemlitApp.zip- 
        name: Fix build.gradle syntax
        run: sed -i 's/isMinifyEnabled = false/minifyEnabled false/' StgNemlitApp/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: cd StgNemlitApp && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: StgNemlitApp/app/build/outputs/apk/debug/app-debug.apk
