name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o StgNemlitApp.zip
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Generate Gradle wrapper
        run: cd StgNemlitApp && gradle wrapper --gradle-version 8.7
      - name: Build debug APK
        run: cd StgNemlitApp && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: StgNemlitApp/app/build/outputs/apk/debug/app-debug.apk
